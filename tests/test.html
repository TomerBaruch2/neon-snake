<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Neon Snake Tests</title></head>
<body>
<pre id="out"></pre>
<!-- 1366x657 ≈ the visible page area of a 1366x768 laptop with browser toolbars -->
<iframe id="game" style="width:1366px;height:657px;border:0"></iframe>
<script src="../script.js"></script>
<script>
const out = document.getElementById('out');
let pass = 0, fail = 0;
function check(name, cond, detail) {
  if (cond) pass++; else fail++;
  out.textContent += (cond ? 'PASS ' : 'FAIL ') + name + (cond || detail === undefined ? '' : '  [' + detail + ']') + '\n';
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const seeded = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(42);
const at = (c, x, y) => c.x === x && c.y === y;
const copy = a => a.map(c => ({ x: c.x, y: c.y }));

function fresh(diff) { const s = Logic.createState(diff || 'normal', seeded); s.food = { x: 0, y: 19 }; return s; }
function ahead(s) { const d = Logic.DIRS[s.dir]; return { x: s.snake[0].x + d.x, y: s.snake[0].y + d.y }; }
function park(s, y) {
  s.snake = [{ x: 3, y }, { x: 2, y }, { x: 1, y }]; s.prev = copy(s.snake);
  s.dir = 'right'; s.queue = []; s.pendingGrowth = 0; s.food = { x: 0, y: 19 }; s.golden = null;
}

function unitTests() {
  let s = Logic.createState('normal', seeded);
  check('initial snake has 3 segments, moving right', s.snake.length === 3 && s.dir === 'right');
  check('initial food not on snake', !s.snake.some(c => at(c, s.food.x, s.food.y)));

  s = fresh(); Logic.step(s);
  check('snake moves right one cell', at(s.snake[0], 11, 10) && s.snake.length === 3);

  s = fresh();
  check('direct reverse is rejected', Logic.queueDirection(s, 'left') === false);
  Logic.queueDirection(s, 'up');
  check('reverse of a queued turn is rejected', Logic.queueDirection(s, 'down') === false);

  s = fresh(); Logic.queueDirection(s, 'up'); Logic.queueDirection(s, 'left');
  Logic.step(s); Logic.step(s);
  check('rapid up+left turns apply in order without dying', s.status === 'running' && at(s.snake[0], 9, 9));

  s = fresh(); s.food = { x: 11, y: 10 }; Logic.step(s); Logic.step(s);
  check('eating gives +10 and grows by 1', s.score === 10 && s.snake.length === 4 && s.foodsEaten === 1);
  check('new food spawned off-snake', s.food && !s.snake.some(c => at(c, s.food.x, s.food.y)));

  s = fresh(); s.snake = [{ x: 19, y: 5 }, { x: 18, y: 5 }, { x: 17, y: 5 }];
  check('wall collision ends game', Logic.step(s)[0].type === 'wall' && s.status === 'over');
  s = fresh(); s.snake = [{ x: 5, y: 0 }, { x: 5, y: 1 }, { x: 5, y: 2 }]; s.dir = 'up';
  check('top wall collision ends game', Logic.step(s)[0].type === 'wall');

  s = fresh();
  s.snake = [{ x: 5, y: 5 }, { x: 6, y: 5 }, { x: 6, y: 6 }, { x: 5, y: 6 }, { x: 4, y: 6 }];
  s.dir = 'left'; Logic.queueDirection(s, 'down');
  check('self collision ends game', Logic.step(s)[0].type === 'self');

  s = fresh(); s.snake = [{ x: 1, y: 1 }, { x: 2, y: 1 }, { x: 2, y: 2 }, { x: 1, y: 2 }];
  s.dir = 'left'; Logic.queueDirection(s, 'down'); Logic.step(s);
  check('moving into vacating tail cell is allowed', s.status === 'running');

  s = fresh(); s.pendingGrowth = 1; s.snake = [{ x: 1, y: 1 }, { x: 2, y: 1 }, { x: 2, y: 2 }, { x: 1, y: 2 }];
  s.dir = 'left'; Logic.queueDirection(s, 'down'); Logic.step(s);
  check('moving into tail while growing is a collision', s.status === 'over');

  check('difficulty base speeds 160/120/85 ms',
    Logic.interval(fresh('easy')) === 160 && Logic.interval(fresh('normal')) === 120 && Logic.interval(fresh('hard')) === 85);
  let mono = true, ordered = true, floor = true;
  for (let lv = 1; lv <= 40; lv++) {
    const iv = d => { const t = fresh(d); t.level = lv; return Logic.interval(t); };
    const e = iv('easy'), n = iv('normal'), h = iv('hard');
    if (!(e > n && n > h)) ordered = false;
    if (e < 80 || n < 60 || h < 45) floor = false;
    if (lv > 1) { const t = fresh('normal'); t.level = lv - 1; if (Logic.interval(t) < n) mono = false; }
  }
  check('speed increases with level (interval never grows)', mono);
  check('speed has a minimum interval per difficulty', floor);
  check('harder difficulty stays faster at every level', ordered);

  s = fresh(); park(s, 5);
  let events = [];
  for (let i = 0; i < 5; i++) { s.food = ahead(s); events = events.concat(Logic.step(s)); }
  check('level 2 after 5 foods', s.level === 2 && events.some(e => e.type === 'levelup'));
  check('golden appears after 5 foods', !!s.golden && s.golden.remaining === 6000);
  check('golden not on snake or food', s.golden && !s.snake.some(c => at(c, s.golden.x, s.golden.y)) && !at(s.food, s.golden.x, s.golden.y));
  check('level 1→2 does not reset score/snake', s.score === 50 && s.snake.length === 8);

  const len = s.snake.length, sc = s.score;
  s.golden = { ...ahead(s), remaining: 6000, total: 6000 }; s.food = { x: 0, y: 19 };
  Logic.step(s); Logic.step(s);
  check('golden gives +50 and grows by 2', s.score === sc + 50 && s.snake.length === len + 2 && s.golden === null);

  s = fresh(); s.golden = { x: 0, y: 0, remaining: 6000, total: 6000 };
  Logic.tickTimers(s, 5000);
  check('golden still present before 6s', !!s.golden);
  const ex = Logic.tickTimers(s, 1001);
  check('golden disappears after 6s', s.golden === null && ex[0].type === 'goldenExpired');

  let overlap = false;
  for (let i = 0; i < 300; i++) {
    const t = Logic.createState('normal');
    for (let k = 0; k < 6; k++) { t.food = ahead(t); park(t, 3 + k); t.food = ahead(t); Logic.step(t); }
    t.foodsEaten = 4; t.food = ahead(t); Logic.step(t);
    if (t.golden && (t.snake.some(c => at(c, t.golden.x, t.golden.y)) || at(t.food, t.golden.x, t.golden.y))) overlap = true;
  }
  check('golden never overlaps snake or food (300 trials)', !overlap);

  s = fresh(); s.food = null; s.snake = [];
  for (let y = 0; y < 20; y++) for (let x = 0; x < 20; x++) if (!(x < 3 && y < 3)) s.snake.push({ x, y });
  check('free cells never include snake cells', Logic.freeCells(s).every(c => c.x < 3 && c.y < 3) && Logic.freeCells(s).length === 9);

  const path = [];
  for (let y = 0; y < 20; y++) for (let i = 0; i < 20; i++) path.push({ x: y % 2 ? 19 - i : i, y });
  s = fresh(); s.snake = path.slice(0, 399).reverse(); s.dir = 'left'; s.food = { ...path[399] };
  let threw = false;
  try { Logic.step(s); Logic.step(s); Logic.tickTimers(s, 100); } catch (e) { threw = true; }
  check('filling the board wins without error', !threw && s.status === 'won' && s.food === null);
}

async function e2e() {
  try { localStorage.clear(); } catch (e) {}
  const frame = document.getElementById('game');
  const load = () => new Promise(r => { frame.onload = r; frame.src = '../index.html?' + Date.now(); });
  await load();
  let w = frame.contentWindow, d = frame.contentDocument;
  const errors = [];
  const watch = () => w.addEventListener('error', e => errors.push(e.message));
  watch();
  const key = code => { const e = new w.KeyboardEvent('keydown', { code, bubbles: true, cancelable: true }); w.dispatchEvent(e); return e; };
  const shown = id => d.getElementById(id).classList.contains('show');
  const N = () => w.__neon;

  await wait(200);
  check('e2e: page fits 1366x768 laptop without scrolling',
    d.documentElement.scrollHeight <= w.innerHeight && d.documentElement.scrollWidth <= w.innerWidth,
    `scroll ${d.documentElement.scrollWidth}x${d.documentElement.scrollHeight} vs ${w.innerWidth}x${w.innerHeight}`);
  const foot = d.querySelector('.footer').getBoundingClientRect();
  check('e2e: footer visible on screen', foot.bottom <= w.innerHeight, foot.bottom);
  check('e2e: start screen shown with Normal default', shown('start-screen') && d.querySelector('.diff-btn.selected').dataset.diff === 'normal');

  d.querySelector('[data-diff="hard"]').click();
  d.getElementById('start-btn').click();
  check('e2e: START begins 3-2-1 countdown', N().mode === 'countdown' && !shown('start-screen'));
  await wait(50);
  check('e2e: countdown shows 3', d.getElementById('countdown').textContent === '3');
  await wait(1200);
  const before = N().state;
  key('KeyR');
  check('e2e: R during countdown restarts cleanly', N().mode === 'countdown' && N().state !== before && N().state.score === 0);
  await wait(3200);
  check('e2e: game running after countdown on Hard', N().mode === 'running' && N().state.difficulty === 'hard');

  key('KeyR');
  await wait(3200);
  let st = N().state; park(st, 4);
  for (let i = 0; i < 10; i++) { key('Space'); await wait(15); }
  check('e2e: even number of pause toggles leaves game running', N().mode === 'running');
  const startX = st.snake[0].x; const t1 = performance.now();
  await wait(600);
  const moved = st.snake[0].x - startX, expected = (performance.now() - t1) / 85;
  check('e2e: no duplicate loops after repeated pause/resume', moved >= expected - 2 && moved <= expected + 1.5, `moved ${moved}, expected ~${expected.toFixed(1)}`);

  park(st, 6);
  const sp = key('Space');
  check('e2e: Space is default-prevented (no page scroll)', sp.defaultPrevented);
  check('e2e: pause shows PAUSED overlay', N().mode === 'paused' && shown('pause-screen'));
  st.golden = { x: 0, y: 0, remaining: 6000, total: 6000 };
  const pausedHead = { ...st.snake[0] };
  await wait(600);
  check('e2e: snake frozen while paused', at(st.snake[0], pausedHead.x, pausedHead.y));
  check('e2e: golden timer frozen while paused', st.golden && st.golden.remaining === 6000);
  d.getElementById('resume-btn').click();
  await wait(300);
  check('e2e: RESUME continues from same state', N().mode === 'running' && st.snake[0].x > pausedHead.x && st.golden.remaining < 6000);

  park(st, 8);
  const ev = key('ArrowDown');
  check('e2e: arrow key default-prevented (no page scroll)', ev.defaultPrevented);
  await wait(200);
  check('e2e: ArrowDown turns snake down', st.snake[0].y > 8 && N().mode === 'running');
  key('KeyS'); key('KeyD'); await wait(200);
  check('e2e: WASD keys steer too', st.dir === 'right');

  park(st, 3);
  key('KeyM');
  check('e2e: M mutes and saves preference', N().muted === true && localStorage.getItem('neonSnake.muted') === '1');
  const soundsBefore = N().sounds.length;
  st.food = ahead(st); await wait(250);
  check('e2e: eating while muted plays no sound', st.score >= 10 && N().sounds.length === soundsBefore, N().sounds.slice(soundsBefore).join(','));
  key('KeyM');
  park(st, 3); st.food = ahead(st); await wait(250);
  check('e2e: unmuted eating plays sound', N().sounds.includes('eat'), N().sounds.join(','));

  park(st, 10); st.foodsEaten = 4; st.food = ahead(st);
  await wait(250);
  check('e2e: level up shows LEVEL UP! and golden', st.level === 2 && d.getElementById('level').textContent === '2' && !!st.golden && d.getElementById('toasts').textContent.includes('LEVEL UP!'));
  park(st, 12); const scoreBefore = st.score; st.golden = { ...ahead(st), remaining: 6000, total: 6000 };
  await wait(250);
  check('e2e: golden gives +50 BONUS!', st.score === scoreBefore + 50 && d.getElementById('toasts').textContent.includes('+50 BONUS!'));

  st.score = 990;
  st.snake = [{ x: 5, y: 0 }, { x: 5, y: 1 }, { x: 5, y: 2 }]; st.prev = copy(st.snake); st.dir = 'up'; st.queue = []; st.pendingGrowth = 0;
  await wait(300);
  check('e2e: hitting wall shows GAME OVER screen', N().mode === 'over' && shown('over-screen') && d.getElementById('over-title').textContent === 'GAME OVER');
  check('e2e: game over shows level, score, foods', /Level 2!/.test(d.getElementById('over-sub').textContent) && d.getElementById('over-score').textContent === '990' && d.getElementById('over-foods').textContent === String(st.foodsEaten));
  check('e2e: NEW HIGH SCORE shown and saved', !d.getElementById('over-record').hidden && localStorage.getItem('neonSnake.best') === '990');
  check('e2e: game over sound played', N().sounds.includes('gameover'));
  key('ArrowUp'); await wait(150);
  check('e2e: keys after game over do not revive game', N().mode === 'over');

  d.getElementById('menu-btn').click();
  check('e2e: MAIN MENU returns to start screen', N().mode === 'menu' && shown('start-screen') && !shown('over-screen'));

  await load(); w = frame.contentWindow; d = frame.contentDocument; watch();
  await wait(200);
  check('e2e: high score persists after refresh', d.getElementById('best').textContent === '990' && d.getElementById('menu-best').textContent === '990');
  check('e2e: difficulty and mute preference persist', d.querySelector('.diff-btn.selected').dataset.diff === 'hard' && w.__neon.muted === false);

  key('Enter');
  check('e2e: Enter starts game from menu', N().mode === 'countdown');
  await wait(3200);
  st = N().state;
  const path = [];
  for (let y = 0; y < 20; y++) for (let i = 0; i < 20; i++) path.push({ x: y % 2 ? 19 - i : i, y });
  st.snake = path.slice(0, 399).reverse(); st.prev = copy(st.snake); st.dir = 'left'; st.queue = []; st.pendingGrowth = 0;
  st.golden = null; st.food = { ...path[399] };
  await wait(300);
  check('e2e: full board shows YOU WIN!', N().mode === 'won' && d.getElementById('over-title').textContent === 'YOU WIN!');
  d.getElementById('again-btn').click();
  check('e2e: PLAY AGAIN restarts fully', N().mode === 'countdown' && N().state.snake.length === 3 && N().state.score === 0 && d.getElementById('score').textContent === '0');

  d.getElementById('help-btn').click();
  check('e2e: help button opens rules', d.getElementById('help-screen').classList.contains('show'));
  d.getElementById('help-close').click();
  check('e2e: help closes', !d.getElementById('help-screen').classList.contains('show'));

  await wait(200);
  check('e2e: no JavaScript errors on the page', errors.length === 0, errors.join(' | '));
}

(async () => {
  try { unitTests(); await e2e(); } catch (e) { fail++; out.textContent += 'ERROR ' + e.stack + '\n'; }
  out.textContent += `\nRESULT: ${pass} passed, ${fail} failed\n`;
  document.title = 'DONE';
  fetch('/report?' + encodeURIComponent(out.textContent)).catch(() => {});
})();
</script>
</body>
</html>
